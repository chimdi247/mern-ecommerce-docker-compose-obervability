server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JSON access logs (to stdout) so Promtail can parse
    # method/status/latency per line -- see observability/README.md.
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"method":"$request_method","uri":"$request_uri",'
      '"status":$status,"request_time":$request_time,'
      '"body_bytes_sent":$body_bytes_sent,"referer":"$http_referer",'
      '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: let react-router handle client-side routes instead
    # of nginx 404ing on a direct load or refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
